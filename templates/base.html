<link href="{% static 'images/favicon.png' %}?v=7" rel="icon" type="image/png">
<link href="{% static 'images/favicon.ico' %}?v=7" rel="shortcut icon" type="image/x-icon">

<!-- jQuery -->
<script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript"></script>

<!-- Bootstrap4 files-->
<script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>
<link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" type="text/css"/>

<!-- Font awesome 5 -->

<!-- custom style -->
<link href="{% static 'css/ui.css' %}?v=53" rel="stylesheet" type="text/css"/>
<link href="{% static 'css/responsive.css' %}?v=40" rel="stylesheet" media="only screen and (max-width: 1200px)" />

<!-- custom javascript -->
<script src="{% static 'js/script.js' %}" type="text/javascript"></script>

<script type="text/javascript">
/// some script

// jquery ready start
$(document).ready(function() {
    $(document).on('click', '.wishlist-toggle-btn', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var btn = $(this);
        var productId = btn.data('product-id');
        if (!productId) return;

        $.ajax({
            url: '/store/wishlist/toggle/' + productId + '/',
            type: 'GET',
            success: function(data) {
                $('.wishlist-toggle-btn[data-product-id="' + productId + '"]').each(function() {
                    var b = $(this);
                    var svg = b.find('svg');
                    var icon = b.find('i');
                    if (data.in_wishlist) {
                        b.addClass('active in-wishlist');
                        if (svg.length) {
                            svg.attr('fill', '#e74c3c');
                            svg.attr('stroke', '#e74c3c');
                        }
                        if (icon.length) {
                            icon.removeClass('far fa-heart').addClass('fas fa-heart text-danger');
                        }
                    } else {
                        b.removeClass('active in-wishlist');
                        if (svg.length) {
                            svg.attr('fill', 'none');
                            svg.attr('stroke', '#8F95A3');
                        }
                        if (icon.length) {
                            icon.removeClass('fas fa-heart text-danger').addClass('far fa-heart');
                        }
                    }
                });

                if ($('#wishlist-badge').length) {
                    $('#wishlist-badge').text(data.wishlist_count);
                }
            },
            error: function(xhr) {
                console.error('Wishlist toggle error:', xhr);
            }
        });
    });
}); 
// jquery end
</script>

</head>
